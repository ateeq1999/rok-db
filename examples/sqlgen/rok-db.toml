# rok-db-gen settings for this example. Run from the repository root:
#   cargo run -p rok-db-codegen -- generate --config examples/sqlgen/rok-db.toml
[gen]
input = "db"
output = "db-gen"
crate_name = "sqlgen-db"
# Inside this repository the generated crate uses the local rok-db; a real
# project would write `rok_db_version = "0.4"` instead.
rok_db_path = "../../crates/rok-db"
