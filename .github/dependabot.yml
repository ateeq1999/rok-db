version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    ignore:
      # Its tags are toolchain versions, not action versions: the MSRV job pins the
      # toolchain through `rust-version` and the others follow `stable`.
      - dependency-name: dtolnay/rust-toolchain
