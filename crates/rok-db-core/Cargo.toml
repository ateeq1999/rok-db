[package]
name = "rok-db-core"
description = "Core runtime for rok-db: models, query builder, values and connection handling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rok-db-core"
keywords = ["orm", "database", "postgres", "sqlx", "async"]
categories = ["database"]

[features]
default = []
chrono = ["sqlx/chrono"]
uuid = ["sqlx/uuid"]
json = ["sqlx/json", "dep:serde", "dep:serde_json"]
migrate = ["sqlx/migrate"]
testing = ["tokio/rt"]
metrics = ["dep:metrics"]
serde = ["dep:serde"]
axum = ["serde", "dep:serde_json", "dep:axum-core", "dep:http"]

[dependencies]
sqlx = { workspace = true }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync", "macros"] }
metrics = { version = "0.24", optional = true, default-features = false }
axum-core = { version = "0.5", optional = true, default-features = false }
http = { version = "1", optional = true, default-features = false }
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
