[package]
name = "rok-db-codegen"
description = "Generate a rok-db crate (models, typed queries and migrations) from .sql files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rok-db-codegen"
keywords = ["orm", "codegen", "postgres", "sqlx", "sql"]
categories = ["database", "development-tools"]

[[bin]]
name = "rok-db-gen"
path = "src/main.rs"

[dependencies]
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

[dev-dependencies]
rok-db = { path = "../rok-db", features = ["testing", "chrono", "decimal"] }
sqlgen-db = { path = "../../examples/sqlgen/db-gen" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
