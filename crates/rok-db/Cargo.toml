[package]
name = "rok-db"
description = "An ergonomic, type-safe async ORM for PostgreSQL built on sqlx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rok-db"
keywords = ["orm", "database", "postgres", "sqlx", "async"]
categories = ["database"]

[features]
default = []
chrono = ["rok-db-core/chrono"]
uuid = ["rok-db-core/uuid"]
json = ["rok-db-core/json"]
migrate = ["rok-db-core/migrate"]
full = ["chrono", "uuid", "json", "migrate"]

[dependencies]
rok-db-core = { workspace = true }
rok-db-macros = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
